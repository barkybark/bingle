<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bingle — 영어 말하기 연습</title>
  <style>
    :root {
      --orange: #F5A623;
      --orange-dark: #E8941A;
      --navy: #1A1A2E;
      --navy-mid: #16213E;
      --navy-light: #1e2d4a;
      --white: #FFFFFF;
      --green: #27AE60;
      --red: #E74C3C;
      --font: 'Segoe UI', 'Apple SD Gothic Neo', -apple-system, sans-serif;
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--font); background: var(--navy); color: var(--white); display: flex; flex-direction: column; height: 100dvh; }

    /* 헤더 */
    #header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--navy-mid); border-bottom:1px solid rgba(255,255,255,.07); flex-shrink:0; gap:8px; }
    .logo { font-size:20px; font-weight:800; color:var(--orange); cursor:pointer; flex-shrink:0; }
    .header-nav { display:flex; gap:6px; flex:1; }
    .nav-btn { padding:6px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.15); background:none; color:rgba(255,255,255,.5); font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font); transition:all .2s; }
    .nav-btn.active { background:var(--orange); border-color:var(--orange); color:var(--navy); }
    .count-badge { font-size:12px; font-weight:700; padding:4px 12px; border-radius:20px; background:rgba(245,166,35,.12); border:1px solid rgba(245,166,35,.28); color:var(--orange); flex-shrink:0; white-space:nowrap; display:none; }
    .logout-btn { padding:5px 12px; border-radius:20px; border:1px solid rgba(255,255,255,.15); background:none; color:rgba(255,255,255,.4); font-size:12px; cursor:pointer; font-family:var(--font); flex-shrink:0; transition:all .2s; }
    .logout-btn:hover { border-color:rgba(255,255,255,.3); color:rgba(255,255,255,.7); }

    /* 화면 — overflow:hidden 제거, 스크롤 허용 */
    .screen { display:none; flex-direction:column; flex:1; overflow-y:auto; }
    .screen.active { display:flex; }

    /* 로그인 */
    #login-screen { justify-content:center; align-items:center; padding:40px 24px; overflow-y:auto; }
    .login-card { background:var(--navy-mid); border:1px solid rgba(255,255,255,.08); border-radius:var(--radius); padding:40px 32px; width:100%; max-width:400px; text-align:center; }
    .login-logo { font-size:48px; font-weight:800; color:var(--orange); margin-bottom:4px; }
    .login-tagline { color:rgba(255,255,255,.5); font-size:14px; margin-bottom:36px; }
    .login-label { text-align:left; font-size:13px; color:rgba(255,255,255,.55); margin-bottom:8px; display:block; }
    .login-input { width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:var(--radius-sm); color:var(--white); font-size:15px; padding:14px 16px; font-family:var(--font); outline:none; transition:border .2s; }
    .login-input:focus { border-color:var(--orange); }
    .login-input::placeholder { color:rgba(255,255,255,.22); }
    .login-btn { width:100%; background:var(--orange); border:none; border-radius:var(--radius-sm); color:var(--navy); font-size:16px; font-weight:700; padding:15px; margin-top:14px; cursor:pointer; font-family:var(--font); }
    .login-error { color:#ff6b6b; font-size:13px; margin-top:10px; display:none; }

    /* 챕터 선택 */
    #chapter-screen { padding:20px; }
    .chapter-title { font-size:15px; font-weight:700; color:rgba(255,255,255,.6); margin-bottom:14px; }
    .chapter-card { background:var(--navy-mid); border:2px solid rgba(245,166,35,.28); border-radius:var(--radius-sm); padding:16px 18px; cursor:pointer; margin-bottom:10px; transition:border-color .2s, background .2s; }
    .chapter-card:hover { border-color:var(--orange); background:var(--navy-light); }
    .chapter-card .c-name { font-size:15px; font-weight:600; color:var(--white); }
    .chapter-card .c-count { font-size:12px; color:rgba(255,255,255,.38); margin-top:3px; }

    /* 암기카드 — 전체가 스크롤되는 하나의 컬럼 */
    #flashcard-screen { padding:20px; align-items:center; }
    .fc-inner { width:100%; max-width:480px; display:flex; flex-direction:column; gap:14px; padding-bottom:30px; }
    .unit-lbl { font-size:11px; font-weight:700; color:var(--orange); letter-spacing:2px; text-transform:uppercase; text-align:center; }
    .flash-card { background:var(--navy-mid); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:28px 24px; text-align:center; }
    .topic-chip { display:inline-block; background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.22); border-radius:20px; padding:4px 14px; font-size:12px; color:var(--orange); font-weight:600; margin-bottom:16px; }
    .korean-txt { font-size:20px; line-height:1.65; color:var(--white); font-weight:600; }
    .hint-box { margin-top:14px; padding:10px 14px; background:rgba(245,166,35,.06); border:1px solid rgba(245,166,35,.14); border-radius:8px; font-size:12px; color:rgba(255,255,255,.48); line-height:1.6; text-align:left; display:none; }
    .hint-box.show { display:block; }
    .eng-reveal { margin-top:14px; padding:14px 16px; background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.28); border-radius:var(--radius-sm); font-size:17px; font-weight:600; color:var(--orange); line-height:1.55; display:none; white-space:pre-line; }
    .eng-reveal.show { display:block; }
    .card-prog { font-size:12px; color:rgba(255,255,255,.28); text-align:center; }

    /* 암기카드 버튼들 */
    .fc-nav { display:flex; gap:10px; }
    .fc-btn { flex:1; padding:12px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:rgba(255,255,255,.55); font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font); transition:all .15s; }
    .fc-btn:active { transform:scale(.96); opacity:.8; }
    .fc-btn-reveal { background:var(--orange); color:var(--navy); border-color:var(--orange); }
    .fc-btn-reveal:active { background:var(--orange-dark); }
    .quick-talk-btn { width:100%; padding:14px; border-radius:var(--radius-sm); background:var(--navy-light); border:2px solid var(--orange); color:var(--orange); font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font); display:none; }
    .quick-talk-btn.show { display:block; }

    /* 대화하기 — 전체 스크롤 */
    #conv-screen { padding:20px; align-items:center; }
    .conv-inner { width:100%; max-width:480px; display:flex; flex-direction:column; gap:12px; padding-bottom:30px; }
    .conv-card { background:var(--navy-mid); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:26px 22px; }
    .voice-row { display:flex; align-items:center; gap:8px; }
    .voice-lbl { font-size:11px; color:rgba(255,255,255,.32); flex-shrink:0; }
    .v-btn { padding:5px 13px; border-radius:20px; border:1px solid rgba(255,255,255,.14); background:none; color:rgba(255,255,255,.42); font-size:12px; cursor:pointer; font-family:var(--font); transition:all .2s; }
    .v-btn.on { background:rgba(245,166,35,.14); border-color:var(--orange); color:var(--orange); }
    .conv-topic-chip { display:inline-block; background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.22); border-radius:20px; padding:3px 12px; font-size:11px; color:var(--orange); font-weight:600; }
    .ai-q-lbl { font-size:10px; color:rgba(255,255,255,.28); letter-spacing:1.5px; text-transform:uppercase; }
    .ai-q-txt { font-size:17px; font-weight:600; color:var(--white); line-height:1.65; }
    .conv-wave { display:flex; align-items:center; gap:3px; height:22px; }
    .conv-wave-bar { width:3px; background:var(--orange); border-radius:3px; height:4px; opacity:.55; }
    .conv-wave-bar.on { animation:wv var(--d,.7s) ease-in-out infinite alternate; }
    @keyframes wv{from{height:4px;opacity:.3}to{height:var(--h,18px);opacity:1}}
    .conv-stat { font-size:13px; color:rgba(255,255,255,.45); min-height:18px; }
    .conv-stat.listening { color:var(--orange); font-weight:600; }
    .transcript { font-size:13px; color:rgba(255,255,255,.32); font-style:italic; min-height:18px; }

    /* 결과 박스 */
    .result-box { padding:14px; background:rgba(245,166,35,.06); border:1px solid rgba(245,166,35,.16); border-radius:var(--radius-sm); display:none; }
    .result-box.show { display:block; }
    .result-score-row { display:flex; align-items:flex-start; gap:12px; margin-bottom:8px; }
    .result-score { font-size:38px; font-weight:800; color:var(--orange); line-height:1; flex-shrink:0; }
    .result-reason { font-size:13px; color:rgba(255,255,255,.52); line-height:1.6; padding-top:4px; }
    .result-model { margin-top:8px; padding:10px 12px; background:rgba(255,255,255,.05); border-radius:8px; font-size:14px; color:var(--white); font-weight:600; }
    .result-coach { margin-top:8px; font-size:13px; color:rgba(255,255,255,.52); line-height:1.6; }

    /* 마이크 + 버튼 영역 */
    .mic-section { background:var(--navy-mid); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:20px 22px; display:flex; flex-direction:column; gap:12px; }
    .mic-row { display:flex; align-items:center; gap:14px; }
    .mic-btn { width:60px; height:60px; border-radius:50%; border:none; background:var(--orange); cursor:pointer; font-size:24px; flex-shrink:0; transition:transform .15s, background .2s; display:flex; align-items:center; justify-content:center; }
    .mic-btn:active { transform:scale(.93); }
    .mic-btn.listening { background:var(--red); animation:pulse 1.2s ease-in-out infinite; }
    .mic-btn.off { background:rgba(255,255,255,.1); cursor:not-allowed; }
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.4)}50%{box-shadow:0 0 0 12px rgba(231,76,60,0)}}
    .mic-hint { font-size:13px; color:rgba(255,255,255,.4); }
    .conv-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .c-btn { flex:1; min-width:80px; padding:11px 8px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,.13); background:rgba(255,255,255,.05); color:rgba(255,255,255,.55); font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font); white-space:nowrap; transition:all .15s; }
    .c-btn:active { transform:scale(.96); opacity:.8; }
    .c-btn.primary { background:var(--orange); color:var(--navy); border-color:var(--orange); }
    .c-btn.primary:active { background:var(--orange-dark); }
    .c-btn.loading { opacity:.5; cursor:not-allowed; pointer-events:none; }

    /* 로딩 */
    .ov { position:fixed; inset:0; background:rgba(26,26,46,.94); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
    .spin { width:40px; height:40px; border:3px solid rgba(245,166,35,.2); border-top-color:var(--orange); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin-txt { color:rgba(255,255,255,.55); font-size:14px; }

    @media(min-width:600px){ .korean-txt{font-size:22px;} .ai-q-txt{font-size:18px;} }
  </style>
</head>
<body>

<div class="ov" id="ov"><div class="spin"></div><div class="spin-txt" id="ov-txt">로딩 중...</div></div>

<!-- 헤더 -->
<div id="header" style="display:none">
  <div class="logo" onclick="goHome()">Bingle</div>
  <div class="header-nav">
    <button class="nav-btn" id="nav-flash" onclick="switchMode('flash')">📖 암기카드</button>
    <button class="nav-btn" id="nav-conv" onclick="switchMode('conv')">🎤 대화하기</button>
  </div>
  <div class="count-badge" id="count-badge">0/10</div>
  <button class="logout-btn" onclick="doLogout()">로그아웃</button>
</div>

<!-- 로그인 -->
<div class="screen active" id="login-screen">
  <div class="login-card">
    <div class="login-logo">Bingle</div>
    <div class="login-tagline">영어 말하기 연습</div>
    <label class="login-label">이메일로 받은 접근 토큰을 입력하세요</label>
    <input class="login-input" id="token-input" type="text" placeholder="토큰 입력"
      autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    <div class="login-error" id="login-error"></div>
    <button class="login-btn" onclick="doLogin()">시작하기</button>
  </div>
</div>

<!-- 챕터 선택 -->
<div class="screen" id="chapter-screen">
  <div class="chapter-title" id="chapter-title">챕터를 선택하세요</div>
  <div id="chapter-list"></div>
</div>

<!-- 암기카드 -->
<div class="screen" id="flashcard-screen">
  <div class="fc-inner">
    <div class="unit-lbl" id="fc-unit"></div>
    <div class="flash-card">
      <div class="topic-chip" id="fc-topic"></div>
      <div class="korean-txt" id="fc-korean"></div>
      <div class="hint-box" id="fc-hint"></div>
      <div class="eng-reveal" id="fc-eng"></div>
    </div>
    <div class="card-prog" id="fc-prog"></div>
    <div class="fc-nav">
      <button class="fc-btn" onclick="fcPrev()">← 이전</button>
      <button class="fc-btn fc-btn-reveal" id="fc-reveal-btn" onclick="fcReveal()">정답 보기</button>
      <button class="fc-btn" id="fc-skip-btn" onclick="fcSkip()">다음 →</button>
    </div>
    <!-- 정답 보기 후 나타남 -->
    <button class="quick-talk-btn" id="quick-talk-btn" onclick="goConvFromFlash()">
      🎤 이 표현으로 대화해 보기
    </button>
  </div>
</div>

<!-- 일일 한도 종료 화면 -->
<div class="screen" id="limit-screen">
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px;">
    <div style="background:var(--navy-mid); border:1px solid rgba(255,255,255,.08); border-radius:var(--radius); padding:40px 32px; width:100%; max-width:400px; text-align:center;">
      <div style="font-size:52px; margin-bottom:16px;">🌟</div>
      <div style="font-size:22px; font-weight:700; margin-bottom:10px;">오늘 대화하기 완료!</div>
      <div style="color:rgba(255,255,255,.5); font-size:14px; line-height:1.7; margin-bottom:28px;">
        하루 20회 대화하기를 모두 마쳤어요.<br>암기카드는 계속 이용 가능합니다!
      </div>
      <button onclick="switchMode('flash')" style="width:100%; background:var(--orange); border:none; border-radius:var(--radius-sm); color:var(--navy); font-size:15px; font-weight:700; padding:15px; cursor:pointer; font-family:var(--font); margin-bottom:10px;">📖 암기카드 계속하기</button>
      <div style="color:rgba(255,255,255,.3); font-size:12px; margin-top:8px;">내일 자정 이후 다시 이용 가능합니다</div>
    </div>
  </div>
</div>

<!-- 대화하기 -->
<div class="screen" id="conv-screen">
  <div class="conv-inner">
    <!-- AI 질문 카드 -->
    <div class="conv-card">
      <div class="voice-row">
        <span class="voice-lbl">AI 목소리:</span>
        <button class="v-btn on" id="vf" onclick="setVoice('female')">👩 여성</button>
        <button class="v-btn" id="vm" onclick="setVoice('male')">👨 남성</button>
      </div>
      <div class="conv-topic-chip" id="conv-topic" style="margin-top:10px; margin-bottom:10px;"></div>
      <div class="ai-q-lbl">AI 질문</div>
      <div class="ai-q-txt" id="conv-q" style="margin-top:6px;">질문을 만드는 중...</div>
      <div class="conv-wave" id="conv-wave" style="margin-top:14px;"></div>
      <div class="conv-stat" id="conv-stat" style="margin-top:6px;">AI 질문을 듣고 있어요</div>
      <div class="transcript" id="conv-trans" style="margin-top:4px;"></div>
    </div>

    <!-- 결과 -->
    <div class="result-box" id="result-box">
      <div class="result-score-row">
        <div class="result-score" id="res-score">-</div>
        <div class="result-reason" id="res-reason"></div>
      </div>
      <div class="result-model" id="res-model"></div>
      <div class="result-coach" id="res-coach"></div>
    </div>

    <!-- 마이크 + 버튼 -->
    <div class="mic-section">
      <!-- 안내 멘트 -->
      <div id="mic-guide" style="font-size:12px; color:rgba(255,255,255,.38); line-height:1.8; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,.06); margin-bottom:12px;">
        💬 질문이 나올 때까지 잠시 기다려주세요.<br>
        🎤 마이크 버튼을 터치하고, 말하세요. 발화가 끝났다면 마이크를 눌러 주세요.<br>
        🔄 목소리를 반복해서 인식하지 못하면 아래 리프레시 버튼을 눌러주세요.
      </div>
      <div class="mic-row">
        <button class="mic-btn off" id="mic-btn" onclick="toggleMic()">🎤</button>
        <div class="mic-hint" id="mic-hint">AI 질문을 먼저 들어보세요</div>
      </div>
      <div class="conv-actions">
        <button class="c-btn" id="btn-replay" onclick="replayQ()">🔊 다시 듣기</button>
        <button class="c-btn" id="btn-refresh-mic" onclick="refreshMic()">🔄 리프레시</button>
        <button class="c-btn" id="btn-retry-speak" onclick="retrySpeak()" style="display:none">🎤 다시 말해보기</button>
        <button class="c-btn primary" id="btn-next-flash" onclick="convDoneBackToFlash()" style="display:none">다음 암기카드 →</button>
        <button class="c-btn" id="btn-retry-flash" onclick="retryFlash()" style="display:none">🔄 암기카드로</button>
        <button class="c-btn primary" id="btn-next-conv" onclick="convNextCard()" style="display:none">다음 카드 →</button>
        <button class="c-btn" onclick="convSkip()">건너뛰기</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = '';
const DAILY_LIMIT = 20;

let S = {
  token: null, all: [], deck: [], idx: 0, card: null,
  usedToday: 0, mode: 'flash',
  fromFlash: false,
  voice: 'female',
  recognition: null, isListening: false,
  audio: null, synth: window.speechSynthesis,
  currentQ: '',
  answerDone: false,
  evaluatingCard: null,  // 평가 중 화면 이탈 방어용 스냅샷
  audioUnlocked: false,  // 모바일 오디오 언락 여부
  ttsTimer: null,        // 소리 겹침 방지용 예약 TTS 타이머
};

// ── 초기화 ──────────────────────────────────────────────────────────
async function init() {
  // 브라우저 체크 — 데스크탑 Chrome이 아니면 권장 안내 모달 (차단 아님, 계속 진행 가능)
  const ua = navigator.userAgent;
  const isDesktopChrome = /Chrome\//.test(ua) && /Google Inc/.test(navigator.vendor) && !/Mobi|Android/i.test(ua);

  if (!isDesktopChrome) {
    await new Promise(resolve => {
      const modal = document.createElement('div');
      modal.style.cssText = `
        position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;
        display:flex;align-items:center;justify-content:center;padding:24px;`;
      modal.innerHTML = `
        <div style="background:#16213E;border:1px solid rgba(245,166,35,.3);border-radius:16px;
          padding:32px 28px;max-width:360px;width:100%;text-align:center;font-family:sans-serif;">
          <div style="font-size:36px;margin-bottom:14px;">💻</div>
          <div style="font-size:17px;font-weight:700;color:#F5A623;margin-bottom:12px;">
            데스크탑 Chrome을 권장합니다
          </div>
          <div style="font-size:13px;color:rgba(255,255,255,.6);line-height:1.8;margin-bottom:24px;">
            Bingle은 음성 인식 기능을 사용합니다.<br>
            모바일이나 다른 브라우저에서는<br>
            음성 인식이 불안정할 수 있어요.<br><br>
            <strong style="color:#fff;">더 나은 경험을 위해<br>데스크탑 Chrome을 사용해주세요.</strong>
          </div>
          <button id="modal-ok" style="width:100%;padding:13px;background:#F5A623;color:#1A1A2E;
            border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;">
            알겠어요, 계속 진행할게요
          </button>
        </div>`;
      document.body.appendChild(modal);
      document.getElementById('modal-ok').onclick = () => {
        document.body.removeChild(modal);
        resolve();
      };
    });
  }

  const wc = document.getElementById('conv-wave');
  for (let i = 0; i < 16; i++) {
    const b = document.createElement('div');
    b.className = 'conv-wave-bar';
    b.style.setProperty('--d', (.4 + Math.random() * .5) + 's');
    b.style.setProperty('--h', (8 + Math.random() * 16) + 'px');
    wc.appendChild(b);
  }
  try { const r = await fetch('/data/sentences.json'); S.all = await r.json(); } catch { S.all = []; }
  const tok = new URLSearchParams(window.location.search).get('token') || localStorage.getItem('bingle_token');
  if (tok) { document.getElementById('token-input').value = tok; await doLogin(); }
  else hideOv();
}

// ── 로그인 ──────────────────────────────────────────────────────────
async function doLogin() {
  const tok = document.getElementById('token-input').value.trim();
  if (!tok) return;
  showOv('인증 중...');
  document.getElementById('login-error').style.display = 'none';
  try {
    const r = await fetch(`${API_BASE}/api/auth`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token:tok})
    });
    const d = await r.json();
    if (!r.ok) {
      document.getElementById('login-error').textContent = d.detail || (r.status === 429 ? `오늘 대화하기 (${DAILY_LIMIT}횟수회)를 모두 사용했습니다.` : '인증 실패');
      document.getElementById('login-error').style.display = 'block';
      hideOv(); return;
    }
    S.token = tok; S.usedToday = d.usage.used;
    localStorage.setItem('bingle_token', tok);
    document.getElementById('header').style.display = 'flex';
    updateBadge(); hideOv();
    goHome();
  } catch {
    document.getElementById('login-error').textContent = '서버 연결 실패. 잠시 후 다시 시도해주세요.';
    document.getElementById('login-error').style.display = 'block';
    hideOv();
  }
}

// ── 홈 / 모드 전환 ──────────────────────────────────────────────────
function goHome() {
  stopAll();
  setActiveNav(S.mode);
  showChapter();
}

function switchMode(mode) {
  stopAll();
  S.mode = mode;
  setActiveNav(mode);
  document.getElementById('count-badge').style.display = mode === 'conv' ? 'inline-block' : 'none';
  showChapter();
}

function setActiveNav(mode) {
  document.getElementById('nav-flash').classList.toggle('active', mode === 'flash');
  document.getElementById('nav-conv').classList.toggle('active', mode === 'conv');
}

// ── 챕터 선택 ───────────────────────────────────────────────────────
function showChapter() {
  const units = {};
  S.all.forEach(c => { if (!units[c.unit]) units[c.unit]={topic:c.topic,count:0}; units[c.unit].count++; });
  const modeLabel = S.mode === 'flash' ? '📖 암기카드' : '🎤 대화하기';
  document.getElementById('chapter-title').textContent = `${modeLabel} — 챕터 선택`;
  let html = `<div class="chapter-card" onclick="startDeck(null)">
    <div class="c-name">전체 (${S.all.length}개)</div><div class="c-count">모든 챕터 랜덤</div></div>`;
  Object.keys(units).sort((a,b)=>a-b).forEach(u => {
    html += `<div class="chapter-card" onclick="startDeck(${u})">
      <div class="c-name">Unit ${u}: ${units[u].topic}</div>
      <div class="c-count">${units[u].count}개</div></div>`;
  });
  document.getElementById('chapter-list').innerHTML = html;
  showScreen('chapter-screen');
}

// ── 덱 빌드 ─────────────────────────────────────────────────────────
function buildDeck(unitNum) {
  let src = unitNum !== null ? S.all.filter(c=>c.unit===unitNum) : S.all;
  S.deck = [...src].sort(() => Math.random() - 0.5);
  S.idx = 0;
}

function startDeck(unitNum) {
  buildDeck(unitNum);
  if (S.mode === 'flash') { showScreen('flashcard-screen'); fcLoad(); }
  else { S.fromFlash = false; startConv(); }
}

// ── 암기카드 ─────────────────────────────────────────────────────────
function fcLoad() {
  if (S.idx >= S.deck.length) { S.deck.sort(() => Math.random() - 0.5); S.idx = 0; }
  S.card = S.deck[S.idx];
  const c = S.card;

  document.getElementById('fc-unit').textContent = `UNIT ${c.unit} — ${c.topic.toUpperCase()}`;
  document.getElementById('fc-topic').textContent = c.topic;
  document.getElementById('fc-korean').textContent = c.korean;
  document.getElementById('fc-prog').textContent = `${S.idx + 1} / ${S.deck.length}`;

  const hEl = document.getElementById('fc-hint');
  if (c.keyword_note && c.keyword_note.trim()) {
    hEl.textContent = '💡 ' + c.keyword_note;
    hEl.className = 'hint-box show';
  } else {
    hEl.className = 'hint-box';
    hEl.textContent = '';
  }

  // 정답 감추기
  document.getElementById('fc-eng').className = 'eng-reveal';
  document.getElementById('fc-eng').textContent = '';

  // 버튼 리셋
  const revealBtn = document.getElementById('fc-reveal-btn');
  revealBtn.style.display = '';
  revealBtn.textContent = '정답 보기';
  revealBtn.className = 'fc-btn fc-btn-reveal';

  document.getElementById('quick-talk-btn').className = 'quick-talk-btn';

  // 화면 맨 위로
  document.getElementById('flashcard-screen').scrollTop = 0;
}

function fcReveal() {
  const c = S.card;
  const el = document.getElementById('fc-eng');
  el.textContent = c.sentence;
  el.className = 'eng-reveal show';

  // "정답 보기" 버튼을 "다음 →" 으로 교체
  // 정답 보기 버튼 숨기고, 원래 다음 버튼도 그대로 유지 (중복 방지)
  document.getElementById('fc-reveal-btn').style.display = 'none';

  // 대화해 보기 버튼 표시
  document.getElementById('quick-talk-btn').className = 'quick-talk-btn show';

  // 정답이 보이도록 살짝 스크롤
  setTimeout(() => {
    document.getElementById('flashcard-screen').scrollTo({top: 9999, behavior:'smooth'});
  }, 100);
}

function fcPrev() {
  if (S.idx > 0) { S.idx--; fcLoad(); }
}

function fcSkip() {
  S.idx++;
  fcLoad();
}

// 암기카드에서 "대화해 보기" 클릭
function goConvFromFlash() {
  S.fromFlash = true;
  startConv();
}

// ── 대화하기 진입 ────────────────────────────────────────────────────
async function startConv() {
  if (S.usedToday >= DAILY_LIMIT) {
    // 6순위: alert 대신 앱 내 종료 화면
    showLimitScreen();
    return;
  }
  // 3순위: 독립 모드에서 덱이 비어있는 경우 방어
  if (!S.fromFlash) {
    if (!S.deck || S.deck.length === 0) {
      // 덱이 없으면 챕터 선택으로 돌아가기
      showChapter();
      return;
    }
    if (S.idx >= S.deck.length) { S.deck.sort(() => Math.random() - 0.5); S.idx = 0; }
    S.card = S.deck[S.idx];
  }
  // 3순위: card가 여전히 null이면 방어
  if (!S.card) { showChapter(); return; }

  resetConvUI();
  showScreen('conv-screen');
  setActiveNav('conv');
  document.getElementById('count-badge').style.display = 'inline-block';
  await loadConvQ();
}

function resetConvUI() {
  document.getElementById('conv-topic').textContent = S.card ? S.card.topic : '';
  document.getElementById('conv-q').textContent = '질문을 만드는 중...';
  document.getElementById('result-box').className = 'result-box';
  document.getElementById('btn-next-flash').style.display = 'none';
  document.getElementById('btn-retry-flash').style.display = 'none';
  document.getElementById('btn-next-conv').style.display = 'none';
  document.getElementById('btn-retry-speak').style.display = 'none';
  document.getElementById('conv-trans').textContent = '';
  setStat('AI 질문을 듣고 있어요', '');
  document.getElementById('mic-hint').textContent = 'AI 질문을 먼저 들어보세요';
  // 안내문 + 리프레시 버튼 표시
  document.getElementById('mic-guide').style.display = 'block';
  document.getElementById('btn-refresh-mic').style.display = 'inline-block';
  S.answerDone = false;
  disableMic();
  document.getElementById('conv-screen').scrollTop = 0;
}

async function loadConvQ() {
  if (!S.card) { showChapter(); return; }

  // conv_prompt가 JSON에 사전생성된 경우 API 호출 없이 즉시 사용
  if (S.card.conv_prompt) {
    S.currentQ = S.card.conv_prompt;
    document.getElementById('conv-topic').textContent = S.card.topic || '';
    document.getElementById('conv-q').textContent = S.card.conv_prompt;
    const ttsResult = await speakAI(S.card.conv_prompt);
    if (ttsResult !== 'ok') {
      setStat('🔇 음성 출력에 실패했어요. 텍스트를 읽고 말해보세요.', '');
      setTimeout(() => setStat('🎤 버튼을 눌러 영어로 대답하세요', 'listening'), 2000);
    } else {
      setStat('🎤 버튼을 눌러 영어로 대답하세요', 'listening');
    }
    enableMic();
    document.getElementById('mic-hint').textContent = '버튼을 누르고 영어로 말하세요';
    return;
  }

  // conv_prompt 없는 카드는 Claude API로 생성 (fallback)
  showOv('AI 질문 생성 중...');
  try {
    const r = await fetch(`${API_BASE}/api/conversation/prompt`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:S.token, target_sentence:S.card.sentence, topic:S.card.topic})
    });
    if (r.status === 401 || r.status === 403) { hideOv(); handleAuthError(); return; }
    if (!r.ok) throw new Error('prompt_fail');
    const d = await r.json();
    if (!d.prompt) throw new Error('prompt_empty');
    hideOv();
    S.currentQ = d.prompt;
    document.getElementById('conv-q').textContent = d.prompt;
    const ttsResult = await speakAI(d.prompt);
    if (ttsResult !== 'ok') {
      setStat('🔇 음성 출력에 실패했어요. 텍스트를 읽고 말해보세요.', '');
      setTimeout(() => setStat('🎤 버튼을 눌러 영어로 대답하세요', 'listening'), 2000);
    } else {
      setStat('🎤 버튼을 눌러 영어로 대답하세요', 'listening');
    }
    enableMic();
    document.getElementById('mic-hint').textContent = '버튼을 누르고 영어로 말하세요';
  } catch {
    hideOv();
    document.getElementById('conv-q').textContent = '질문 생성에 실패했습니다.';
    setStat('네트워크 오류가 발생했습니다.', '');
    document.getElementById('mic-hint').textContent = '아래 버튼을 눌러 다시 시도해주세요';
    const retryBtn = document.getElementById('btn-retry-flash');
    retryBtn.textContent = '🔄 다시 시도';
    retryBtn.onclick = () => { retryBtn.style.display = 'none'; retryBtn.onclick = null; loadConvQ(); };
    retryBtn.style.display = 'block';
  }
}

// ── TTS ─────────────────────────────────────────────────────────────
const TTS_TIMEOUT_MS = 8000; // TTS 최대 대기 시간

async function speakAI(text) {
  stopAudio();
  // OpenAI TTS 시도
  try {
    const r = await fetch(`${API_BASE}/api/tts`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:S.token, text, gender:S.voice})
    });
    if (!r.ok) throw new Error('tts_api_fail');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    return new Promise((resolve) => {
      const a = new Audio(url);
      S.audio = a;
      // Q2: Audio 자체 timeout — 재생 시작 후 너무 오래 걸리면 강제 종료
      const t = setTimeout(() => {
        URL.revokeObjectURL(url);
        S.audio = null;
        resolve('timeout');
      }, TTS_TIMEOUT_MS);
      a.onended = () => { clearTimeout(t); URL.revokeObjectURL(url); S.audio = null; resolve('ok'); };
      a.onerror = () => { clearTimeout(t); URL.revokeObjectURL(url); S.audio = null; resolve('audio_error'); };
      a.play().catch(() => { clearTimeout(t); URL.revokeObjectURL(url); S.audio = null; resolve('play_blocked'); });
    });
  } catch {
    // Q2: 브라우저 TTS fallback — 역시 timeout 적용
    return new Promise((resolve) => {
      // 브라우저 TTS가 아예 없는 환경 방어
      if (!S.synth) { resolve('no_synth'); return; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.88;
      const t = setTimeout(() => {
        try { S.synth.cancel(); } catch {}
        resolve('synth_timeout');
      }, TTS_TIMEOUT_MS);
      u.onend = () => { clearTimeout(t); resolve('ok'); };
      u.onerror = () => { clearTimeout(t); resolve('synth_error'); };
      try {
        S.synth.speak(u);
      } catch {
        clearTimeout(t);
        resolve('synth_fail');
      }
    });
  }
}

function stopAudio() {
  if (S.audio) { S.audio.pause(); S.audio = null; }
  if (S.synth.speaking) S.synth.cancel();
}

function setVoice(g) {
  S.voice = g;
  document.getElementById('vf').className = 'v-btn' + (g === 'female' ? ' on' : '');
  document.getElementById('vm').className = 'v-btn' + (g === 'male' ? ' on' : '');
}

// 다시 듣기 — 답변 전/후 모두 작동
async function replayQ() {
  if (!S.currentQ) return;
  const btn = document.getElementById('btn-replay');
  btn.classList.add('loading');
  btn.textContent = '🔊 불러오는 중...';
  // 5순위: TTS 재생 중 마이크 비활성화 (동시 작동 방지)
  if (S.isListening && S.recognition) S.recognition.abort();
  disableMic();
  stopAudio();
  if (!S.answerDone) {
    setStat('🔊 다시 듣는 중...', '');
    await speakAI(S.currentQ);
    enableMic();
    setStat('🎤 버튼을 눌러 영어로 대답하세요', 'listening');
  } else {
    await speakAI(`Here's the expression: "${S.card.sentence}". Try to remember it!`);
  }
  btn.classList.remove('loading');
  btn.textContent = '🔊 다시 듣기';
}

// ── STT ─────────────────────────────────────────────────────────────
// iOS는 setTimeout 안 rec.start()가 사용자 제스처 없이 호출되어 마이크 권한이 막힘
// 따라서 iOS는 재시작 루프 없이 단순 1회 인식 + 리프레시 버튼 유도 방식 사용
const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

function enableMic() {
  document.getElementById('mic-btn').className = 'mic-btn';
}
function disableMic() {
  document.getElementById('mic-btn').className = 'mic-btn off';
  stopWave();
}

function toggleMic() {
  if (document.getElementById('mic-btn').classList.contains('off')) return;
  if (S.isListening) {
    // 듣는 중 재탭 → 발화 종료 신호
    if (S.recognition) {
      S.recognition._userStopped = true; // 사용자가 직접 종료했음을 표시
      try { S.recognition.stop(); } catch {}
    }
  } else {
    startListening();
  }
}

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStat('⚠️ Chrome 브라우저를 사용해주세요.', ''); return; }
  if (S.isListening) return;
  S.isListening = true;
  document.getElementById('mic-btn').className = 'mic-btn listening';
  document.getElementById('mic-hint').textContent = '듣는 중... 말이 끝나면 자동으로 멈춰요';
  setStat('듣는 중...', 'listening');
  startWave();
  if (IS_IOS) startListeningIOS();
  else startListeningDesktop();
}

// 데스크탑/안드로이드: 재시작 루프 방식
// 자동 침묵 감지 없음 — 마이크 버튼 재탭으로만 종료
function startListeningDesktop() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let finalText = '';
  let shouldStop = false;

  function finish() {
    S.isListening = false;
    stopWave();
    document.getElementById('mic-btn').className = 'mic-btn off';
    const ans = finalText.trim();
    if (ans) {
      document.getElementById('mic-hint').textContent = '분석 중...';
      evaluate(ans);
    } else {
      setStat('🎤 버튼을 눌러 영어로 대답하세요', 'listening');
      document.getElementById('mic-hint').textContent = '발화가 끝났다면 마이크를 눌러 주세요.';
      enableMic();
    }
  }

  function startRec() {
    if (shouldStop) { finish(); return; }

    const rec = new SR();
    rec.lang = 'en-US';
    rec.continuous = false;
    rec.interimResults = true;
    S.recognition = rec;

    rec.onresult = (e) => {
      let interim = '';
      // finalText 초기화 금지 — 재시작 걸쳐 누적
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
        else interim = e.results[i][0].transcript;
      }
      document.getElementById('conv-trans').textContent = (finalText + interim).trim();
    };

    rec.onend = () => {
      if (shouldStop || rec._userStopped) {
        // 사용자가 버튼 탭으로 종료 or shouldStop
        finish();
      } else {
        // 브라우저 자동 종료 → 즉시 재시작
        setTimeout(() => startRec(), 80);
      }
    };

    rec.onerror = (e) => {
      if (e.error === 'not-allowed') {
        shouldStop = true;
        S.isListening = false; stopWave();
        setStat('❌ 마이크 접근을 허용해주세요.', '');
        document.getElementById('mic-btn').className = 'mic-btn off';
      }
      // 그 외 오류는 onend에서 재시작
    };

    try { rec.start(); } catch { shouldStop = true; finish(); }
  }

  startRec();
}

// iOS: 1회 인식 방식 — 마이크 버튼 재탭으로 종료
function startListeningIOS() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let finalText = '';
  const rec = new SR();
  rec.lang = 'en-US'; rec.continuous = false; rec.interimResults = true;
  S.recognition = rec;

  function highlightRefresh() {
    const rb = document.getElementById('btn-refresh-mic');
    if (!rb) return;
    rb.style.background = 'rgba(245,166,35,.3)';
    rb.style.borderColor = 'var(--orange)';
    rb.style.color = 'var(--orange)';
    rb.style.transform = 'scale(1.05)';
    setTimeout(() => {
      rb.style.background = ''; rb.style.borderColor = '';
      rb.style.color = ''; rb.style.transform = '';
    }, 3000);
  }

  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
      else interim = e.results[i][0].transcript;
    }
    document.getElementById('conv-trans').textContent = (finalText + interim).trim();
  };

  rec.onend = () => {
    S.isListening = false; stopWave();
    document.getElementById('mic-btn').className = 'mic-btn off';
    const ans = finalText.trim();
    if (ans) {
      document.getElementById('mic-hint').textContent = '분석 중...';
      evaluate(ans);
    } else {
      setStat('🎤 인식이 안 됐어요. 🔄 리프레시 버튼을 눌러주세요.', 'listening');
      document.getElementById('mic-hint').textContent = '🔄 리프레시 버튼을 눌러주세요';
      enableMic();
      highlightRefresh();
    }
  };

  rec.onerror = (e) => {
    S.isListening = false; stopWave();
    if (e.error === 'not-allowed') {
      setStat('❌ 마이크 접근을 허용해주세요.', '');
      document.getElementById('mic-btn').className = 'mic-btn off';
    } else {
      setStat('🎤 인식 오류. 🔄 리프레시 버튼을 눌러주세요.', 'listening');
      document.getElementById('mic-hint').textContent = '🔄 리프레시 버튼을 눌러주세요';
      enableMic();
      highlightRefresh();
    }
  };

  try { rec.start(); } catch {
    S.isListening = false; enableMic();
    setStat('🎤 버튼을 눌러 영어로 대답하세요', 'listening');
  }
}

// ── 평가 ─────────────────────────────────────────────────────────────
async function evaluate(answer) {
  disableMic();
  setStat('분석 중...', '');
  showOv('답변 분석 중...');
  S.evaluatingCard = S.card;

  try {
    const r = await fetch(`${API_BASE}/api/conversation/evaluate`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        token:S.token, target_sentence:S.evaluatingCard.sentence,
        topic:S.evaluatingCard.topic, user_answer:answer
      })
    });
    if (r.status === 401 || r.status === 403) { handleAuthError(); return; }
    if (!r.ok) throw new Error(`eval_fail_${r.status}`);

    const d = await r.json();

    // Q2: 화면 이탈 방어 — 응답 왔을 때 카드가 바뀌었으면 무시
    if (!S.evaluatingCard || S.evaluatingCard.id !== (S.card && S.card.id)) return;

    document.getElementById('res-score').textContent = d.score;
    document.getElementById('res-reason').textContent = d.score_reason || '';
    document.getElementById('res-model').textContent = '💡 ' + (d.model_answer || S.evaluatingCard.sentence);
    document.getElementById('res-coach').textContent = d.coach_comment || '';
    document.getElementById('result-box').className = 'result-box show';
    S.answerDone = true;
    document.getElementById('mic-hint').textContent = '평가 완료';
    // 평가 완료 후 안내문 + 리프레시 버튼 숨기기
    document.getElementById('mic-guide').style.display = 'none';
    document.getElementById('btn-refresh-mic').style.display = 'none';
    // 다시 말해보기 버튼 항상 표시 (횟수 차감 없이 재도전)
    document.getElementById('btn-retry-speak').style.display = 'block';

    const level = d.level || 2;

    // Q4: markDone 429 시 즉시 중단 — showLimitScreen 후 이후 코드 실행 막기
    const limitReached = await markDone(level >= 3);
    if (limitReached) return;

    if (level === 1) {
      setStat('🔄 ' + (d.coach_comment || '다시 도전해보세요'), '');
      if (S.fromFlash) {
        document.getElementById('btn-retry-flash').style.display = 'block';
      } else {
        const btn = document.getElementById('btn-retry-flash');
        btn.textContent = '🔄 다시 도전';
        btn.onclick = () => { S.answerDone = false; resetConvUI(); loadConvQ(); };
        btn.style.display = 'block';
      }
    } else {
      setStat('✅ ' + (d.coach_comment || '잘했어요!'), 'listening');
      if (S.fromFlash) {
        document.getElementById('btn-next-flash').style.display = 'block';
      } else {
        document.getElementById('btn-next-conv').style.display = 'block';
      }
    }

    setTimeout(() => {
      document.getElementById('conv-screen').scrollTo({top:9999, behavior:'smooth'});
    }, 200);

    const snapCard = S.evaluatingCard;
    S.ttsTimer = setTimeout(async () => {
      S.ttsTimer = null;
      await speakAI(`Here's the expression: "${d.model_answer || snapCard.sentence}". Now try it yourself!`);
    }, 600);
    S.evaluatingCard = null;

  } catch {
    setStat('평가 중 오류가 발생했습니다.', '');
    enableMic();
    document.getElementById('mic-hint').textContent = '버튼을 누르고 영어로 말하세요';
  } finally {
    // Q3: 어떤 경우에도 로딩 오버레이는 반드시 닫힘
    hideOv();
  }
}

// markDone: 한도 초과(429) 시 true 반환 → evaluate가 즉시 중단
async function markDone(passed) {
  try {
    const r = await fetch(`${API_BASE}/api/practice/complete`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:S.token, card_id:S.card.id, passed})
    });
    if (r.status === 401 || r.status === 403) { handleAuthError(); return true; }
    if (r.status === 429) { showLimitScreen(); return true; }  // Q4: true 반환
    if (r.ok) { const d = await r.json(); S.usedToday = d.used_today; updateBadge(); }
    return false;
  } catch {
    return false; // 네트워크 실패 시엔 계속 진행 (카운트 누락은 감수)
  }
}

// ── 버튼 핸들러 ─────────────────────────────────────────────────────
function convDoneBackToFlash() {
  stopAll();
  S.fromFlash = false;
  S.idx++;
  S.mode = 'flash';
  setActiveNav('flash');
  document.getElementById('count-badge').style.display = 'none';
  showScreen('flashcard-screen');
  fcLoad();
}

function retryFlash() {
  stopAll();
  S.fromFlash = false;
  S.mode = 'flash';
  setActiveNav('flash');
  document.getElementById('count-badge').style.display = 'none';
  showScreen('flashcard-screen');
  fcLoad(); // 같은 idx → 같은 카드
}

function convNextCard() {
  stopAll();
  S.idx++;
  S.fromFlash = false;
  startConv();
}

function convSkip() {
  stopAll();
  if (S.fromFlash) {
    S.fromFlash = false;
    S.idx++;
    S.mode = 'flash';
    setActiveNav('flash');
    document.getElementById('count-badge').style.display = 'none';
    showScreen('flashcard-screen');
    fcLoad();
  } else {
    S.idx++;
    startConv();
  }
}

// 다시 말해보기 — 횟수 차감 없이 같은 카드로 재도전
function retrySpeak() {
  stopAll();
  S.answerDone = false;
  S.evaluatingCard = null;
  // 결과 숨기기
  document.getElementById('result-box').className = 'result-box';
  document.getElementById('btn-retry-speak').style.display = 'none';
  document.getElementById('btn-next-flash').style.display = 'none';
  document.getElementById('btn-retry-flash').style.display = 'none';
  document.getElementById('btn-next-conv').style.display = 'none';
  document.getElementById('conv-trans').textContent = '';
  // 안내문 + 리프레시 버튼 다시 표시
  document.getElementById('mic-guide').style.display = 'block';
  document.getElementById('btn-refresh-mic').style.display = 'inline-block';
  // 마이크 다시 활성화
  enableMic();
  setStat('🎤 버튼을 눌러 다시 말해보세요', 'listening');
  document.getElementById('mic-hint').textContent = '발화가 끝났다면 마이크를 눌러 주세요.';
}

// 6순위: 일일 한도 종료 화면
function showLimitScreen() {
  stopAll();
  document.getElementById('count-badge').style.display = 'none';
  setActiveNav('conv');
  showScreen('limit-screen');
}
function refreshMic() {
  // 기존 인식 인스턴스 완전 제거
  if (S.recognition) {
    try { S.recognition.abort(); } catch {}
    try { S.recognition.stop(); } catch {}
    S.recognition = null;
  }
  S.isListening = false;
  stopWave();
  // 버튼/상태 초기화
  document.getElementById('mic-btn').className = 'mic-btn';
  setStat('🎤 버튼을 눌러 영어로 대답하세요', 'listening');
  document.getElementById('mic-hint').textContent = '버튼을 누르고 영어로 말하세요';
  document.getElementById('conv-trans').textContent = '';
  // iOS: 잠깐 딜레이 후 마이크 활성화 (시스템이 마이크 해제할 시간 확보)
  if (IS_IOS) {
    document.getElementById('mic-btn').className = 'mic-btn off';
    setTimeout(() => {
      document.getElementById('mic-btn').className = 'mic-btn';
    }, 500);
  }
}

// 로그아웃
function doLogout() {
  stopAll();
  localStorage.removeItem('bingle_token');
  S.token = null;
  S.usedToday = 0;
  S.deck = [];
  S.card = null;
  document.getElementById('header').style.display = 'none';
  document.getElementById('token-input').value = '';
  document.getElementById('login-error').style.display = 'none';
  showScreen('login-screen');
}

// 7순위: 토큰 만료/비활성화 처리 → 로그인 화면으로
function handleAuthError() {
  stopAll();
  localStorage.removeItem('bingle_token');
  S.token = null;
  document.getElementById('header').style.display = 'none';
  document.getElementById('token-input').value = '';
  document.getElementById('login-error').textContent = '접근 권한이 만료되었습니다. 다시 로그인해주세요.';
  document.getElementById('login-error').style.display = 'block';
  showScreen('login-screen');
}

// ── 유틸 ────────────────────────────────────────────────────────────
function stopAll() {
  // 예약된 TTS 타이머 취소 (소리 겹침 방지)
  if (S.ttsTimer) { clearTimeout(S.ttsTimer); S.ttsTimer = null; }
  // 진행 중인 오디오 즉시 중단
  stopAudio();
  // STT 중단
  if (S.recognition) {
    try { S.recognition.abort(); } catch {}
    S.recognition = null;
  }
  S.isListening = false;
}
function setStat(txt, cls) {
  const el = document.getElementById('conv-stat');
  if (el) { el.textContent = txt; el.className = 'conv-stat' + (cls ? ' ' + cls : ''); }
}
function startWave() { document.querySelectorAll('.conv-wave-bar').forEach(b => b.classList.add('on')); }
function stopWave() { document.querySelectorAll('.conv-wave-bar').forEach(b => b.classList.remove('on')); }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showOv(t) { document.getElementById('ov-txt').textContent = t; document.getElementById('ov').style.display = 'flex'; }
function hideOv() { document.getElementById('ov').style.display = 'none'; }
function updateBadge() { document.getElementById('count-badge').textContent = `${S.usedToday}/${DAILY_LIMIT}`; }

document.getElementById('token-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// 4순위: 모바일 오디오 언락 — 첫 터치/클릭 시 빈 오디오 재생으로 브라우저 제한 해제
function unlockAudio() {
  if (S.audioUnlocked) return;
  const a = new Audio();
  a.play().catch(() => {});
  S.audioUnlocked = true;
  document.removeEventListener('touchstart', unlockAudio);
  document.removeEventListener('click', unlockAudio);
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });

init();
</script>
